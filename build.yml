name: apk
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install "Cython==0.29.37" buildozer
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with: {name: castops-apk, path: bin/*.apk}
